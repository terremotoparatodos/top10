<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top 10 Pokémon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* ===== CONFIG VISUAL ===== */
:root{
  --bg:#141850; --bg2:#1E2468; --slot:#262E80; --slot-hi:#33408F;
  --gold:#FFD23F; --gold-dk:#C99A00; --ink:#F4F6FF; --muted:#9AA3D9; --line:#3A4499;
  --display:'Bungee', 'Arial Black', sans-serif; --body:'Rubik', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}

/* ===== PANEL ===== */
#panel{display:grid;grid-template-columns:minmax(320px,420px) 1fr;min-height:100%}
.side{background:var(--bg2);padding:20px;border-right:2px solid var(--line);overflow-y:auto;max-height:100vh}
.side h1{font-family:var(--display);font-size:26px;color:var(--gold);margin-bottom:4px}
.side .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.group{margin-bottom:18px}
.group h2{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.group h2 small{font-weight:400;color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid transparent;background:var(--slot);color:var(--ink);padding:5px 10px;border-radius:999px;font-size:13px;font-weight:500;opacity:.55}
.chip.on{opacity:1;border-color:var(--ink)}
.chip.type{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.seg{display:flex;background:var(--slot);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;background:none;border:0;color:var(--muted);padding:7px 4px;border-radius:8px;font-size:13px;font-weight:500}
.seg button.on{background:var(--gold);color:#1A1A1A}
.row{display:flex;gap:8px;align-items:center}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.toggle input{width:18px;height:18px;accent-color:var(--gold)}
input[type=text],input[type=number],select{background:var(--bg);border:2px solid var(--line);color:var(--ink);padding:8px 10px;border-radius:8px;font:inherit;font-size:14px;width:100%}
.link{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline}

.main{padding:20px 24px;overflow-y:auto;max-height:100vh}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.btn{background:var(--slot);color:var(--ink);border:2px solid var(--line);padding:9px 14px;border-radius:10px;font-weight:700;font-size:14px}
.btn.primary{background:var(--gold);color:#1A1A1A;border-color:var(--gold)}
.btn:hover{border-color:var(--ink)}
.status{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#777}
.dot.ok{background:#4CD97B}
#titleIn{font-size:18px;font-weight:700;margin-bottom:6px}
.count{color:var(--muted);font-size:13px;margin-bottom:12px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:44px 56px 1fr auto auto auto;gap:12px;align-items:center;background:var(--slot);border-radius:12px;padding:6px 12px 6px 6px;border:2px solid transparent}
.item.out{opacity:.45}
.item.rev{border-color:var(--gold)}
.item .pos{font-family:var(--display);font-size:22px;text-align:center;color:var(--gold)}
.item.out .pos{color:var(--muted);font-size:14px}
.item img{width:56px;height:56px;object-fit:contain}
.item .nm{font-weight:700}
.item .meta{font-size:12px;color:var(--muted);display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.tp{font-size:11px;padding:1px 7px;border-radius:999px;color:#fff;font-weight:500}
.item .val{font-family:var(--display);font-size:22px;min-width:56px;text-align:right}
.tie{font-size:11px;color:var(--gold);font-weight:700}
.sm{padding:6px 10px;font-size:13px}
.empty{color:var(--muted);padding:40px 0;text-align:center}

/* ===== TV ===== */
#tv{height:100vh;width:100vw;display:flex;flex-direction:column;padding:3.5vh 4vw;gap:3vh;overflow:hidden;
  background:radial-gradient(ellipse at 50% -10%, #2B3399 0%, var(--bg) 60%)}
.tv-head{text-align:center}
.tv-head .k{font-family:var(--display);color:var(--gold);font-size:7vh;line-height:1;text-shadow:0 .6vh 0 var(--gold-dk)}
.tv-head .t{font-size:3.6vh;font-weight:900;margin-top:1.2vh}
.tv-head .s{display:flex;justify-content:center;gap:1vh;margin-top:1.2vh;flex-wrap:wrap}
.tv-head .s span{font-size:2.2vh;padding:.4vh 1.6vh;border-radius:999px;background:var(--slot);font-weight:700}
.board{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);grid-auto-flow:column;gap:1.6vh 2.5vw;min-height:0}
.slot{perspective:1200px;min-height:0}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.slot.open .card{transform:rotateX(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:1.6vh;display:flex;align-items:center;overflow:hidden}
.front{background:var(--slot);border:.35vh solid var(--line)}
.front .n{font-family:var(--display);font-size:6vh;width:11vh;text-align:center;color:var(--gold)}
.front .bars{flex:1;height:30%;margin-right:3vh;border-radius:1vh;background:repeating-linear-gradient(90deg,var(--slot-hi) 0 2vh,transparent 2vh 3vh)}
.back{background:linear-gradient(90deg,var(--gold) 0 11vh,var(--slot-hi) 11vh);transform:rotateX(180deg);border:.35vh solid var(--gold)}
.back .n{font-family:var(--display);font-size:6vh;width:11vh;text-align:center;color:#1A1A1A}
.back img{height:100%;aspect-ratio:1;object-fit:contain;padding:.6vh;filter:drop-shadow(0 .5vh .4vh rgba(0,0,0,.4))}
.back .info{flex:1;min-width:0;padding-left:1vh}
.back .nm{font-size:3.6vh;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back .tps{display:flex;gap:.6vh;margin-top:.5vh}
.back .tps .tp{font-size:1.7vh;padding:.2vh 1.2vh}
.back .v{font-family:var(--display);font-size:5.4vh;padding:0 3vh;color:var(--gold)}
.tv-foot{position:fixed;bottom:1.2vh;right:1.6vw;font-size:1.6vh;color:var(--muted);opacity:.6}

@media (max-width:820px){#panel{grid-template-columns:1fr}.side,.main{max-height:none}.item{grid-template-columns:34px 44px 1fr auto;}.item .x{display:none}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>

<!-- ================= PANEL ================= -->
<div id="panel" class="hidden">
  <aside class="side">
    <h1>Top 10</h1>
    <p class="sub">Filtrá, armá el top y revelalo en la TV.</p>

    <div class="group">
      <h2>Tipos <button class="link" data-clear="types">Limpiar</button></h2>
      <div class="chips" id="typeChips"></div>
      <div class="seg" id="typeMode" style="margin-top:8px">
        <button data-v="any">Tiene alguno</button><button data-v="all">Tiene todos</button><button data-v="mono">Solo monotipo</button>
      </div>
    </div>

    <div class="group">
      <h2>Generación <button class="link" data-clear="gens">Limpiar</button></h2>
      <div class="chips" id="genChips"></div>
    </div>

    <div class="group">
      <h2>Ordenar por</h2>
      <select id="statSel"></select>
      <div class="seg" id="orderSeg" style="margin-top:8px">
        <button data-v="desc">Mayor primero</button><button data-v="asc">Menor primero</button>
      </div>
    </div>

    <div class="group">
      <h2>Mínimos de stats <small>opcional</small></h2>
      <div id="mins" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px"></div>
    </div>

    <div class="group">
      <h2>Incluir</h2>
      <label class="toggle"><input type="checkbox" id="incLeg" checked> Legendarios</label>
      <label class="toggle"><input type="checkbox" id="incMyth" checked> Singulares (míticos)</label>
      <label class="toggle"><input type="checkbox" id="incForms"> Megas, formas regionales y otras</label>
      <label class="toggle"><input type="checkbox" id="onlyFinal"> Solo sin evolución posterior</label>
    </div>

    <div class="group">
      <h2>Sala de sincronización</h2>
      <div class="row"><input type="text" id="roomIn" maxlength="24"><button class="btn sm" id="roomBtn">Usar</button></div>
      <p class="sub" style="margin:6px 0 0">La TV tiene que abrir la misma sala.</p>
    </div>
  </aside>

  <main class="main">
    <div class="bar">
      <button class="btn primary" id="buildBtn">Armar Top 10 con este filtro</button>
      <button class="btn" id="revealNext">Revelar siguiente</button>
      <button class="btn" id="revealAll">Revelar todo</button>
      <button class="btn" id="hideAll">Ocultar todo</button>
      <button class="btn" id="openTv">Abrir vista TV</button>
      <span class="status"><span class="dot" id="dot"></span><span id="statusTx">Sin conexión</span></span>
    </div>
    <input type="text" id="titleIn" placeholder="Título que se ve en la TV">
    <div class="row" style="margin-bottom:10px"><select id="revealOrder" style="max-width:260px"><option value="bottom">Revelar siguiente: del 10 al 1</option><option value="top">Revelar siguiente: del 1 al 10</option></select></div>
    <p class="count" id="count"></p>
    <div class="list" id="list"></div>
  </main>
</div>

<!-- ================= TV ================= -->
<div id="tv" class="hidden">
  <div class="tv-head">
    <div class="k">TOP 10</div>
    <div class="t" id="tvTitle"></div>
    <div class="s" id="tvTags"></div>
  </div>
  <div class="board" id="board"></div>
  <div class="tv-foot" id="tvFoot"></div>
</div>

/* =========================================================
   SINCRONIZACIÓN (BroadcastChannel + localStorage + Supabase)
   ========================================================= */
const params = new URLSearchParams(location.search);
const IS_TV = params.has('tv');
let room = params.get('sala') || localStorage.getItem('top10_room') || 'principal';
let bc, sbChan, sb;
const listeners = [];
function connect(onMsg){
  listeners.length = 0; listeners.push(onMsg);
  try{ bc && bc.close(); bc = new BroadcastChannel('top10_'+room); bc.onmessage = e => onMsg(e.data); }catch(e){}
  if (SUPABASE_KEY && window.supabase){
    sb = sb || window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    if (sbChan) sb.removeChannel(sbChan);
    sbChan = sb.channel('top10_'+room, {config:{broadcast:{self:false}}});
    sbChan.on('broadcast', {event:'msg'}, p => onMsg(p.payload));
    sbChan.subscribe(s => setStatus(s === 'SUBSCRIBED', s === 'SUBSCRIBED' ? 'En línea · sala '+room : 'Conectando…'));
  } else setStatus(true, 'Local · sala '+room);
}
function send(msg){
  try{ bc && bc.postMessage(msg); }catch(e){}
  if (sbChan) sbChan.send({type:'broadcast', event:'msg', payload:msg});
}
window.addEventListener('storage', e => { if (e.key === 'top10_state_'+room && e.newValue && IS_TV) listeners[0] && listeners[0]({t:'state', s:JSON.parse(e.newValue)}); });
function setStatus(ok, tx){ const d=document.getElementById('dot'), s=document.getElementById('statusTx'); if(d){d.classList.toggle('ok',ok); s.textContent=tx;} }

const tpChip = t => `<span class="tp" style="background:${TYPES[t-1][1]}">${TYPES[t-1][0]}</span>`;
const statVal = (p, s) => s === 8 ? HW[p[0]][0] : s === 7 ? HW[p[0]][1] : s === 6 ? p[4].reduce((a,b)=>a+b,0) : p[4][s];
const statText = (p, s) => s === 7 ? statVal(p,s).toLocaleString('es-AR') + ' kg' : s === 8 ? statVal(p,s).toLocaleString('es-AR') + ' m' : statVal(p,s);

/* =========================================================
   VISTA TV
   ========================================================= */
function initTV(){
  document.getElementById('tv').classList.remove('hidden');
  document.getElementById('tvFoot').textContent = 'Sala ' + room;
  let last = null;
  const render = s => {
    const board = document.getElementById('board');
    document.getElementById('tvTitle').textContent = s ? s.title : 'Esperando al panel…';
    document.getElementById('tvTags').innerHTML = s ? s.tags.map(t=>`<span>${t}</span>`).join('') : '';
    const sameSet = last && s && last.key === s.key;
    if (!sameSet){
      board.innerHTML = '';
      for (let i=0;i<TOP_N;i++){
        const e = s && s.entries[i];
        board.insertAdjacentHTML('beforeend', `<div class="slot" data-i="${i}"><div class="card">
          <div class="face front"><div class="n">${i+1}</div><div class="bars"></div></div>
          <div class="face back">${e?`<div class="n">${i+1}</div><img src="${SPRITE(e.id)}" alt=""><div class="info"><div class="nm">${e.name}</div><div class="tps">${e.types.map(tpChip).join('')}</div></div><div class="v">${e.value}</div>`:''}</div>
        </div></div>`);
      }
    }
    board.querySelectorAll('.slot').forEach((el,i)=> el.classList.toggle('open', !!(s && s.revealed[i] && s.entries[i])));
    last = s;
  };
  render(null);
  connect(m => { if (m.t === 'state') render(m.s); });
  try{ const saved = localStorage.getItem('top10_state_'+room); if (saved) render(JSON.parse(saved)); }catch(e){}
  const hello = () => send({t:'hello'});
  hello(); setTimeout(hello, 1500); setTimeout(hello, 4000);
}

/* =========================================================
   PANEL
   ========================================================= */
function initPanel(){
  document.getElementById('panel').classList.remove('hidden');
  const f = { types:new Set(), typeMode:'any', gens:new Set(), stat:6, order:'desc', mins:[0,0,0,0,0,0] };
  let excluded = new Set();
  let show = null; // lo que está "en el aire": {key,title,tags,entries,revealed}

  // UI de filtros
  const typeChips = document.getElementById('typeChips');
  TYPES.forEach(([n,c],i)=> typeChips.insertAdjacentHTML('beforeend', `<button class="chip type" style="background:${c}" data-t="${i+1}">${n}</button>`));
  const genChips = document.getElementById('genChips');
  for (let g=1; g<=9; g++) genChips.insertAdjacentHTML('beforeend', `<button class="chip" data-g="${g}">Gen ${g}</button>`);
  const statSel = document.getElementById('statSel');
  STATS.forEach((s,i)=> statSel.insertAdjacentHTML('beforeend', `<option value="${i}">${s}</option>`));
  statSel.value = 6;
  const mins = document.getElementById('mins');
  STATS.slice(0,6).forEach((s,i)=> mins.insertAdjacentHTML('beforeend', `<label style="font-size:12px;color:var(--muted)">${s}<input type="number" min="0" max="255" placeholder="0" data-m="${i}"></label>`));

  const seg = (id, key) => { const el=document.getElementById(id); const sync=()=>el.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.v===f[key])); el.onclick=e=>{ if(e.target.dataset.v){ f[key]=e.target.dataset.v; sync(); refresh(); } }; sync(); };
  seg('typeMode','typeMode'); seg('orderSeg','order');

  typeChips.onclick = e => { const t=+e.target.dataset.t; if(!t) return; f.types.has(t)?f.types.delete(t):f.types.add(t); e.target.classList.toggle('on'); refresh(); };
  genChips.onclick = e => { const g=+e.target.dataset.g; if(!g) return; f.gens.has(g)?f.gens.delete(g):f.gens.add(g); e.target.classList.toggle('on'); refresh(); };
  document.querySelectorAll('[data-clear]').forEach(b=> b.onclick=()=>{ f[b.dataset.clear].clear(); (b.dataset.clear==='types'?typeChips:genChips).querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); refresh(); });
  statSel.onchange = () => { f.stat=+statSel.value; refresh(); };
  mins.oninput = e => { const i=e.target.dataset.m; if(i!==undefined){ f.mins[i]=+e.target.value||0; refresh(); } };
  ['incLeg','incMyth','incForms','onlyFinal'].forEach(id=> document.getElementById(id).onchange = refresh);

  function filtered(){
    const leg=incLeg.checked, myth=incMyth.checked, forms=incForms.checked, fin=onlyFinal.checked;
    let r = DEX.filter(p=>{
      if (!forms && p[6]) return false;
      if (!leg && p[5]===1) return false;
      if (!myth && p[5]===2) return false;
      if (fin && p[7]) return false;
      if (f.gens.size && !f.gens.has(p[2])) return false;
      if (f.types.size){
        const t=p[3];
        if (f.typeMode==='any' && !t.some(x=>f.types.has(x))) return false;
        if (f.typeMode==='all' && ![...f.types].every(x=>t.includes(x))) return false;
        if (f.typeMode==='mono' && !(t.length===1 && f.types.has(t[0]))) return false;
      } else if (f.typeMode==='mono' && p[3].length!==1) return false;
      for (let i=0;i<6;i++) if (p[4][i] < f.mins[i]) return false;
      return true;
    });
    r.sort((a,b)=> (f.order==='desc'?-1:1)*(statVal(a,f.stat)-statVal(b,f.stat)) || a[0]-b[0]);
    return r;
  }
  function autoTitle(){
    const desc = f.order==='desc';
    if (f.stat === 7) return `Los Pokémon más ${desc ? 'pesados' : 'livianos'}`;
    if (f.stat === 8) return `Los Pokémon más ${desc ? 'altos' : 'bajos'}`;
    const st = STATS[f.stat], dir = desc ? 'más' : 'menos';
    return `Los Pokémon con ${dir} ${st.toLowerCase()}`;
  }
  function tags(){
    const t=[];
    if (f.types.size) t.push([...f.types].map(x=>TYPES[x-1][0]).join(f.typeMode==='all'?' + ':' / ') + (f.typeMode==='mono'?' (monotipo)':''));
    if (f.gens.size) t.push('Gen ' + [...f.gens].sort((a,b)=>a-b).join(', '));
    t.push(STATS[f.stat]);
    return t;
  }

  const list = document.getElementById('list'), titleIn = document.getElementById('titleIn');
  let current = [];
  function refresh(){
    current = filtered();
    const shown = current.slice(0, 40);
    document.getElementById('count').textContent = `${current.length} Pokémon cumplen el filtro. Se muestran los primeros ${Math.min(40,current.length)}. Tocá ✕ para sacar uno del top.`;
    if (!titleIn.dataset.touched) titleIn.value = autoTitle();
    let pos = 0;
    list.innerHTML = shown.length ? shown.map((p,i)=>{
      const out = excluded.has(p[0]); if(!out) pos++;
      const v = statVal(p,f.stat), prev = shown[i-1], next = shown[i+1];
      const tie = (prev && statVal(prev,f.stat)===v) || (next && statVal(next,f.stat)===v);
      const inShow = show && show.ids.indexOf(p[0]);
      return `<div class="item ${out?'out':''} ${show && inShow>-1 && show.revealed[inShow]?'rev':''}">
        <div class="pos">${out?'—':pos}</div><img src="${SPRITE(p[0])}" alt="" loading="lazy">
        <div><div class="nm">${p[1]}</div><div class="meta">${p[3].map(tpChip).join('')} <span>Gen ${p[2]}</span> ${tie?'<span class="tie">Empate</span>':''}</div></div>
        <div class="val">${statText(p,f.stat)}</div>
        ${show && inShow>-1 ? `<button class="btn sm" data-rev="${inShow}">${show.revealed[inShow]?'Ocultar':'Revelar'}</button>` : '<span></span>'}
        <button class="btn sm x" data-ex="${p[0]}">${out?'Volver':'✕'}</button>
      </div>`;}).join('') : '<p class="empty">Ningún Pokémon cumple este filtro. Probá sacando un tipo o una generación.</p>';
  }
  list.onclick = e => {
    const ex = e.target.dataset.ex, rv = e.target.dataset.rev;
    if (ex){ const id=+ex; excluded.has(id)?excluded.delete(id):excluded.add(id); refresh(); }
    if (rv!==undefined){ show.revealed[rv]=!show.revealed[rv]; broadcast(); }
  };
  titleIn.oninput = () => { titleIn.dataset.touched = 1; if (show){ show.title = titleIn.value; broadcast(); } };

  document.getElementById('buildBtn').onclick = () => {
    const top = current.filter(p=>!excluded.has(p[0])).slice(0, TOP_N);
    if (!top.length) return;
    show = { key: Date.now(), title: titleIn.value || autoTitle(), tags: tags(), ids: top.map(p=>p[0]),
      entries: top.map(p=>({id:p[0], name:p[1], types:p[3], value:statText(p,f.stat)})), revealed: top.map(()=>false) };
    broadcast();
  };
  const revealOrder = document.getElementById('revealOrder');
  document.getElementById('revealNext').onclick = () => {
    if (!show) return;
    const idx = [...show.revealed.keys()]; if (revealOrder.value==='bottom') idx.reverse();
    const i = idx.find(i=>!show.revealed[i]); if (i!==undefined){ show.revealed[i]=true; broadcast(); }
  };
  document.getElementById('revealAll').onclick = () => { if(show){ show.revealed=show.revealed.map(()=>true); broadcast(); } };
  document.getElementById('hideAll').onclick = () => { if(show){ show.revealed=show.revealed.map(()=>false); broadcast(); } };
  document.getElementById('openTv').onclick = () => window.open(`${location.pathname}?tv&sala=${encodeURIComponent(room)}`, 'top10tv');

  function broadcast(){
    if (!show) return;
    const s = {key:show.key, title:show.title, tags:show.tags, entries:show.entries, revealed:show.revealed};
    try{ localStorage.setItem('top10_state_'+room, JSON.stringify(s)); }catch(e){}
    send({t:'state', s}); refresh();
  }
  const roomIn = document.getElementById('roomIn'); roomIn.value = room;
  document.getElementById('roomBtn').onclick = () => { room = roomIn.value.trim() || 'principal'; try{localStorage.setItem('top10_room',room);}catch(e){} connect(onMsg); broadcast(); };
  const onMsg = m => { if (m.t==='hello') broadcast(); };
  connect(onMsg);
  refresh();
}

IS_TV ? initTV() : initPanel();
</script>
</body>
</html>
